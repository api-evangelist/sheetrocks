name: SheetRocks
description: >-
  SheetRocks is a spreadsheet engine embedded directly into the business
  platforms teams already use. Branded "The Spreadsheet for Everywhere," it
  brings keyboard-driven data entry, formula-based analytics, and
  spreadsheet-in-the-loop workflows inside host applications such as
  Salesforce (live), WooCommerce and Gravity Forms (beta), and Shopify,
  HubSpot, and ServiceNow (announced). The product targets operators,
  analysts, and builders who want a familiar grid plus instant workflow
  invocation without leaving their platform of record. SheetRocks is a
  portfolio company of Bloomberg Beta. As of this enrichment pass it exposes
  no public REST/GraphQL API, OpenAPI specification, SDKs, or webhook surface;
  it does publish product documentation, a free sandbox, and a responsible
  security-disclosure policy.
